<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晶晶公主工作台">
<meta name="theme-color" content="#FFB6D9">
<title>晶晶公主工作台</title>
<style>
/* ==================== CSS Variables ==================== */
:root {
  --pink: #FFB6D9;
  --pink-light: #FCE7F3;
  --pink-deep: #FF9ECF;
  --purple: #C9A6E2;
  --purple-light: #E8DAF5;
  --purple-deep: #A87BC9;
  --gold: #FFD700;
  --gold-light: #FFF3B0;
  --text: #4A3850;
  --text-muted: #9B8A9E;
  --text-light: #C4B8C7;
  --bg: #FFF5FA;
  --bg-gradient: linear-gradient(180deg, #FCE7F3 0%, #F5E6F5 50%, #E8DAF5 100%);
  --card-bg: #FFFFFF;
  --radius: 16px;
  --radius-sm: 8px;
  --gap: 16px;
  --gap-sm: 8px;
  --font-title: 18px;
  --font-body: 14px;
  --font-sm: 12px;
  --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --shadow: 0 2px 12px rgba(255, 182, 217, 0.15);
  --shadow-deep: 0 4px 20px rgba(201, 166, 226, 0.2);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  font-family: var(--font-family);
  font-size: var(--font-body);
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
}

body {
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg-gradient);
  min-height: 100vh;
  position: relative;
  box-shadow: 0 0 40px rgba(201, 166, 226, 0.15);
}

/* ==================== 可爱背景装饰 ==================== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,182,217,0.15) 0%, transparent 8%),
    radial-gradient(circle at 85% 15%, rgba(255,215,0,0.08) 0%, transparent 6%),
    radial-gradient(circle at 75% 60%, rgba(201,166,226,0.12) 0%, transparent 8%),
    radial-gradient(circle at 25% 80%, rgba(255,182,217,0.1) 0%, transparent 6%),
    radial-gradient(circle at 50% 45%, rgba(255,215,0,0.05) 0%, transparent 10%);
}

/* 星星浮动动画 */
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
@keyframes float-slow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  33% { transform: translateY(-8px) rotate(5deg); }
  66% { transform: translateY(4px) rotate(-3deg); }
}
@keyframes drift {
  0% { transform: translateX(0) translateY(0); }
  50% { transform: translateX(10px) translateY(-5px); }
  100% { transform: translateX(0) translateY(0); }
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* 背景装饰元素 */
.deco-star {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  animation: twinkle 3s ease-in-out infinite;
}
.deco-float {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  animation: float-slow 4s ease-in-out infinite;
}
.deco-drift {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  animation: drift 6s ease-in-out infinite;
}

#app, #sidebar-nav, #more-sheet, #lock-screen {
  position: relative;
  z-index: 1;
}

/* Safari HTML5 兼容：确保 <main> 为块级元素 */
main, #main {
  display: block;
}

/* ==================== Lock Screen ==================== */
#lock-screen {
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 100vh;
  background: linear-gradient(135deg, #FFB6D9 0%, #E8B8E8 30%, #C9A6E2 70%, #A87BC9 100%);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  transition: opacity 0.5s, transform 0.5s;
  overflow: hidden;
}

/* 锁屏背景星星 */
#lock-screen::before {
  content: '✨ ⭐ ✨ 🌟 ⭐ ✨ 🌟 ⭐ ✨ ⭐ ✨ 🌟 ⭐ ✨';
  position: absolute;
  top: 8%; left: 0;
  width: 100%;
  font-size: 14px;
  text-align: center;
  opacity: 0.3;
  animation: twinkle 2s ease-in-out infinite;
  letter-spacing: 20px;
  pointer-events: none;
}
#lock-screen::after {
  content: '⭐ ✨ 🌟 ✨ ⭐ ✨ 🌟 ⭐ ✨ ⭐ 🌟 ✨ ⭐ ✨ ⭐';
  position: absolute;
  bottom: 10%; left: 0;
  width: 100%;
  font-size: 12px;
  text-align: center;
  opacity: 0.25;
  animation: twinkle 2.5s ease-in-out infinite 0.5s;
  letter-spacing: 18px;
  pointer-events: none;
}

#lock-screen.unlocked {
  opacity: 0;
  transform: translateX(-50%) scale(1.1);
  pointer-events: none;
}

.lock-crown {
  font-size: 56px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.lock-title {
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  text-shadow: 0 2px 10px rgba(0,0,0,0.15);
}

.lock-subtitle {
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  margin-top: -16px;
}

.lock-dots {
  display: flex;
  gap: 16px;
  margin: 12px 0;
}

.lock-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.6);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.lock-dot.filled {
  background: #FFD700;
  border-color: #FFD700;
  box-shadow: 0 0 12px rgba(255,215,0,0.6);
  transform: scale(1.2);
  animation: heartbeat 0.6s ease;
}

.lock-keypad {
  display: grid;
  grid-template-columns: repeat(3, 64px);
  gap: 12px;
}

.lock-key {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 22px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
}

.lock-key:active {
  transform: scale(0.85);
  background: rgba(255,255,255,0.4);
}

.lock-key.del {
  background: rgba(255,255,255,0.1);
  font-size: 18px;
}

.lock-hint {
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  margin-top: 8px;
}

.lock-error {
  color: #FFD700;
  font-size: 13px;
  min-height: 18px;
}

/* ==================== App Layout ==================== */
#app {
  min-height: 100vh;
}

#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,182,217,0.2);
  margin-left: 56px;
}

#header-settings {
  width: 36px;
  height: 36px;
  border: none;
  background: none;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all 0.15s;
}

#header-settings:active {
  background: var(--pink-light);
  transform: scale(0.9);
}

/* ==================== Sidebar Nav ==================== */
#sidebar-nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 56px;
  height: 100vh;
  height: 100dvh;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(20px);
  border-right: 1px solid rgba(255,182,217,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0 env(safe-area-inset-bottom, 16px);
  z-index: 200;
  overflow-y: auto;
  gap: 2px;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 8px 4px;
  min-width: 48px;
  min-height: 48px;
  width: 48px;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  background: none;
  border-radius: 12px;
  flex-shrink: 0;
}

.nav-item:active {
  transform: scale(0.9);
  background: var(--pink-light);
}

.nav-item.active {
  background: var(--pink-light);
  position: relative;
}

.nav-item.active::after {
  content: '⭐';
  position: absolute;
  top: 2px;
  right: 2px;
  font-size: 8px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
  transition: transform 0.2s;
}

.nav-item.active .nav-icon {
  transform: scale(1.2) rotate(-5deg);
}

.nav-label {
  font-size: 9px;
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
}

.nav-item.active .nav-label {
  color: var(--pink-deep);
  font-weight: 700;
}

/* 更多按钮样式 */
.nav-more {
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid rgba(255,182,217,0.15);
}

#more-sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--card-bg);
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
  z-index: 300;
  padding: 16px;
  display: none;
  max-height: 70vh;
  overflow-y: auto;
}

#more-sheet.show { display: block; }

.more-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 8px;
  border: none;
  background: none;
  width: 100%;
  cursor: pointer;
  border-radius: 8px;
  font-size: var(--font-body);
  color: var(--text);
  min-height: 44px;
}

.more-item:active { background: var(--pink-light); }

/* Overlay for more sheet */
#sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 299;
  display: none;
}

#sheet-overlay.show { display: block; }

/* Main area offset for sidebar */
#main {
  margin-left: 56px;
  padding: 16px;
  min-height: 100vh;
}

/* lock screen stays centered */
#lock-screen {
  left: 50%;
  transform: translateX(-50%);
}

/* 响应式：小手机侧边栏更窄 */
@media (max-width: 360px) {
  #sidebar-nav { width: 44px; }
  .nav-item { width: 40px; min-width: 40px; min-height: 40px; }
  .nav-icon { font-size: 18px; }
  .nav-label { font-size: 8px; }
  #main { margin-left: 44px; }
  #header { margin-left: 44px; }
}

/* ==================== Card ==================== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 2px 12px rgba(255, 182, 217, 0.15);
  margin-bottom: var(--gap);
  position: relative;
  border: 1.5px solid rgba(255, 182, 217, 0.12);
  transition: transform 0.2s, box-shadow 0.2s;
}

.card:active {
  transform: scale(0.98);
}

/* 卡片左上角小星星装饰 */
.card::before {
  content: '✨';
  position: absolute;
  top: -6px;
  right: 12px;
  font-size: 10px;
  opacity: 0.4;
  pointer-events: none;
}

.card-title {
  font-size: var(--font-title);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-title::after {
  content: '💕';
  font-size: 12px;
  opacity: 0.3;
  margin-left: auto;
}

/* ==================== Buttons ==================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px 16px;
  min-height: 44px;
  border: none;
  border-radius: 24px;
  font-size: var(--font-body);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-family: var(--font-family);
  position: relative;
  overflow: hidden;
}

.btn:active {
  transform: scale(0.92);
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink), var(--pink-deep));
  color: #fff;
  box-shadow: 0 2px 8px rgba(255,182,217,0.3);
}

.btn-purple {
  background: linear-gradient(135deg, var(--purple), var(--purple-deep));
  color: #fff;
  box-shadow: 0 2px 8px rgba(201,166,226,0.3);
}

.btn-gold {
  background: linear-gradient(135deg, var(--gold), #FFA500);
  color: #fff;
}

.btn-outline {
  background: transparent;
  color: var(--pink-deep);
  border: 1.5px solid var(--pink);
}

.btn-sm {
  padding: 6px 12px;
  min-height: 32px;
  font-size: var(--font-sm);
  border-radius: var(--radius-sm);
}

/* ==================== Inputs ==================== */
input, select, textarea {
  font-family: var(--font-family);
  font-size: var(--font-body);
  color: var(--text);
}

input[type="text"], input[type="number"], input[type="password"],
input[type="date"], select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid rgba(255,182,217,0.3);
  border-radius: var(--radius);
  font-size: var(--font-body);
  outline: none;
  transition: border-color 0.2s;
  background: #fff;
  box-sizing: border-box;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--pink);
}

/* ==================== Modal ==================== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(74,56,80,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
  backdrop-filter: blur(4px);
}

.modal-content {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  width: 100%;
  max-width: 380px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

/* ==================== Toast ==================== */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(74,56,80,0.9);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: var(--font-sm);
  z-index: 99999;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  white-space: nowrap;
  max-width: 90%;
  overflow: hidden;
  text-overflow: ellipsis;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
}

/* ==================== Misc ==================== */
.progress-bar {
  width: 100%;
  height: 8px;
  background: rgba(0,0,0,0.06);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pink), var(--purple));
  border-radius: 4px;
  transition: width 0.5s;
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.2); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* Star decoration */
.star-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.star {
  position: absolute;
  font-size: 10px;
  color: var(--gold);
  opacity: 0.3;
  animation: twinkle 3s ease-in-out infinite;
}

@media (min-width: 481px) {
  body {
    border-left: 1px solid rgba(201,166,226,0.1);
    border-right: 1px solid rgba(201,166,226,0.1);
  }
}
</style>
</head>
<body>

<!-- ==================== 可爱背景装饰 ==================== -->
<div class="star-bg" id="star-bg"></div>

<!-- 乌萨奇装饰（SVG手绘，固定在角落） -->
<div style="position:fixed;bottom:12px;right:8px;z-index:0;pointer-events:none;opacity:0.5;width:60px;" class="deco-drift">
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <!-- 乌萨奇身体 -->
    <ellipse cx="50" cy="65" rx="38" ry="42" fill="#F5E6D3" stroke="#D4B896" stroke-width="1.5"/>
    <!-- 耳朵 -->
    <ellipse cx="32" cy="28" rx="10" ry="18" fill="#F5E6D3" stroke="#D4B896" stroke-width="1.5" transform="rotate(-15 32 28)"/>
    <ellipse cx="68" cy="28" rx="10" ry="18" fill="#F5E6D3" stroke="#D4B896" stroke-width="1.5" transform="rotate(15 68 28)"/>
    <!-- 耳朵内侧 -->
    <ellipse cx="32" cy="32" rx="4" ry="10" fill="#FFCCCC" transform="rotate(-15 32 32)"/>
    <ellipse cx="68" cy="32" rx="4" ry="10" fill="#FFCCCC" transform="rotate(15 68 32)"/>
    <!-- 眼睛 -->
    <ellipse cx="38" cy="58" rx="4" ry="6" fill="#333"/>
    <ellipse cx="62" cy="58" rx="4" ry="6" fill="#333"/>
    <circle cx="39" cy="56" r="1.5" fill="#fff"/>
    <circle cx="63" cy="56" r="1.5" fill="#fff"/>
    <!-- 腮红 -->
    <ellipse cx="28" cy="72" rx="6" ry="4" fill="#FFB6C1" opacity="0.6"/>
    <ellipse cx="72" cy="72" rx="6" ry="4" fill="#FFB6C1" opacity="0.6"/>
    <!-- 嘴巴 -->
    <path d="M 44 78 Q 50 84 56 78" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 头顶星星 -->
    <text x="50" y="18" text-anchor="middle" font-size="14">⭐</text>
  </svg>
</div>

<!-- 星星人装饰（SVG手绘，固定在左上角） -->
<div style="position:fixed;top:70px;left:64px;z-index:0;pointer-events:none;opacity:0.4;width:50px;" class="deco-float">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 星星人身体 -->
    <path d="M 50 10 L 58 38 L 88 38 L 64 56 L 72 84 L 50 68 L 28 84 L 36 56 L 12 38 L 42 38 Z" fill="#FFD700" stroke="#E6B800" stroke-width="1.5"/>
    <!-- 眼睛 -->
    <ellipse cx="42" cy="45" rx="3" ry="4" fill="#333"/>
    <ellipse cx="58" cy="45" rx="3" ry="4" fill="#333"/>
    <circle cx="43" cy="44" r="1" fill="#fff"/>
    <circle cx="59" cy="44" r="1" fill="#fff"/>
    <!-- 腮红 -->
    <circle cx="35" cy="52" r="3" fill="#FFB6C1" opacity="0.7"/>
    <circle cx="65" cy="52" r="3" fill="#FFB6C1" opacity="0.7"/>
    <!-- 嘴巴 -->
    <path d="M 45 55 Q 50 58 55 55" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<!-- 浮动小装饰 -->
<div style="position:fixed;top:200px;right:12px;z-index:0;pointer-events:none;opacity:0.3;font-size:20px;" class="deco-float">🌙</div>
<div style="position:fixed;top:400px;left:60px;z-index:0;pointer-events:none;opacity:0.25;font-size:16px;" class="deco-drift">✨</div>
<div style="position:fixed;top:600px;right:16px;z-index:0;pointer-events:none;opacity:0.2;font-size:18px;" class="deco-float">⭐</div>
<div style="position:fixed;bottom:200px;left:64px;z-index:0;pointer-events:none;opacity:0.25;font-size:14px;" class="deco-drift">💫</div>

<!-- ==================== Lock Screen ==================== -->
<div id="lock-screen">
  <div class="lock-crown">👑</div>
  <div class="lock-title">晶晶公主工作台</div>
  <div class="lock-subtitle">请输入4位密码</div>
  <div class="lock-dots" id="lock-dots">
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
    <div class="lock-dot"></div>
  </div>
  <div class="lock-error" id="lock-error"></div>
  <div class="lock-keypad" id="lock-keypad">
    <button class="lock-key" data-key="1">1</button>
    <button class="lock-key" data-key="2">2</button>

// ==================== Utility Functions ====================
var $ = function(sel, ctx) { return (ctx || document).querySelector(sel); };

  },
  set: function(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.warn('Storage full:', e); }

  del: function(key) { localStorage.removeItem(key); }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmt(n) { return parseFloat(n || 0).toFixed(2); }
function fmtDate(d) { if (!d) return ''; return d; }
function fmtTime(t) { return t || ''; }
function debounce(fn, wait) { var timer; return function() { var args = arguments, ctx = this; clearTimeout(timer); timer = setTimeout(function() { fn.apply(ctx, args); }, wait); }; }

var toastTimer;
function toast(msg) {
  var el = document.getElementById('toast');

  el.textContent = msg;

// ==================== Password / Lock ====================
function hashCode(str) {
  var hash = 0;
  if (!str) return hash;
  for (var i = 0; i < str.length; i++) {
    var ch = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + ch;
    hash = hash & hash;
  }
  return hash.toString();
}

var lockInput = '';

function initLock() {
  var pwd = LS.get('jj_password');
  var hint = document.getElementById('lock-hint');
  if (!pwd) {
    hint.textContent = '首次进入请设置4位密码';
  } else {
    hint.textContent = '请输入密码解锁';
  }

  var keypad = document.getElementById('lock-keypad');
  keypad.querySelectorAll('.lock-key').forEach(function(btn) {
    btn.onclick = function() {
      var key = btn.dataset.key;
      if (key === 'del') {
        lockInput = lockInput.slice(0, -1);
      } else if (lockInput.length < 4) {
        lockInput += key;
      }
      updateLockDots();
      if (lockInput.length === 4) {
        setTimeout(checkLock, 200);
      }
    };
  });
}

function updateLockDots() {
  var dots = document.querySelectorAll('.lock-dot');
  dots.forEach(function(dot, i) {
    if (i < lockInput.length) dot.classList.add('filled');
    else dot.classList.remove('filled');
  });
}

function checkLock() {
  var pwd = LS.get('jj_password');
  var errEl = document.getElementById('lock-error');
  if (!pwd) {
    // Set password
    LS.set('jj_password', hashCode(lockInput));
    errEl.textContent = '';
    unlock();
  } else {
    if (hashCode(lockInput) === pwd) {
      errEl.textContent = '';
      unlock();
    } else {
      errEl.textContent = '密码错误，请重试';
      lockInput = '';
      updateLockDots();
      var ls = document.getElementById('lock-screen');
      ls.style.animation = 'none';
      void ls.offsetHeight;
      ls.style.animation = '';
    }
  }
}

function unlock() {
  var ls = document.getElementById('lock-screen');
  ls.classList.add('unlocked');
  setTimeout(function() {
    ls.style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  }, 500);
}

  { key: 'habit', label: '习惯', icon: '🌱', render: 'renderHabit' },

function getNavConfig() {
  if (!STATE.navConfig) {
    STATE.navConfig = {
      visible: ['home', 'water', 'money', 'sport', 'plan', 'work', 'fund', 'habit', 'love', 'bank', 'korean', 'cpa', 'wiki'],
      more: []
    };
    LS.set('jj_navConfig', STATE.navConfig);
    NAV_CONFIG = STATE.navConfig;
  }
  // 确保所有新模块都包含在 visible 中（兼容旧版本数据）
  var allKeys = ALL_MODULES.map(function(m) { return m.key; });
  allKeys.forEach(function(key) {
    if (STATE.navConfig.visible.indexOf(key) < 0 && STATE.navConfig.more.indexOf(key) < 0) {
      STATE.navConfig.visible.push(key);
    }
  });
  // 移除已不存在的模块（如旧的 study 模块）
  STATE.navConfig.visible = STATE.navConfig.visible.filter(function(k) { return allKeys.indexOf(k) >= 0; });
  STATE.navConfig.more = STATE.navConfig.more.filter(function(k) { return allKeys.indexOf(k) >= 0; });
  return STATE.navConfig;
}

function renderNav() {
  var cfg = getNavConfig();

  var visibleItems = cfg.visible;

    var m = ALL_MODULES.find(function(x) { return x.key === key; });
    if (!m) return '';
    return '<button class="nav-item ' + (currentTab === key ? 'active' : '') + '" data-tab="' + key + '">' +
      '<span class="nav-icon">' + m.icon + '</span>' +
      '<span class="nav-label">' + m.label + '</span></button>';

  nav.innerHTML = items;
  nav.querySelectorAll('.nav-item[data-tab]').forEach(function(btn) {

function openMoreSheet() {
  var cfg = getNavConfig();
  var allModules = ALL_MODULES;
  var visibleSet = {};
  cfg.visible.forEach(function(k) { visibleSet[k] = true; });

  var html = '<div style="font-size:var(--font-title);font-weight:700;color:var(--purple-deep);margin-bottom:12px;">全部模块</div>';
  allModules.forEach(function(m) {
    var isVisible = visibleSet[m.key];
    html += '<div class="more-item" style="justify-content:space-between;" data-key="' + m.key + '">' +
      '<span>' + m.icon + ' ' + m.label + '</span>' +
      '<span style="font-size:var(--font-sm);color:' + (isVisible ? 'var(--purple-deep)' : 'var(--text-muted)') + ';">' + (isVisible ? '侧边栏中' : '点击添加') + '</span>' +
      '</div>';
  });

  var sheet = document.getElementById('more-sheet');
  sheet.innerHTML = html;
  sheet.classList.add('show');
  document.getElementById('sheet-overlay').classList.add('show');

  sheet.querySelectorAll('.more-item').forEach(function(item) {
    item.onclick = function() {
      var key = this.dataset.key;
      // Toggle: if visible and not home, move to more; if hidden, move to visible
      if (key === 'home') { switchTab('home'); closeMoreSheet(); return; }

      var idx = cfg.visible.indexOf(key);
      if (idx >= 0 && cfg.visible.length > 1) {
        cfg.visible.splice(idx, 1);
        cfg.more.push(key);
      } else if (idx < 0) {
        cfg.more = cfg.more.filter(function(k) { return k !== key; });
        cfg.visible.push(key);
      }
      STATE.navConfig = cfg;
      LS.set('jj_navConfig', cfg);
      closeMoreSheet();
      renderNav();
    };
  });
}

function closeMoreSheet() {
  document.getElementById('more-sheet').classList.remove('show');
  document.getElementById('sheet-overlay').classList.remove('show');
}

function switchTab(key) {
  currentTab = key;

    document.getElementById('header-title').textContent = m.icon + ' ' + m.label;
    var fn = window[m.render];
    if (fn) fn(document.getElementById('main'));

  renderNav();
}

function drawCosmos(container, undoneItems, total, allDone) {
  var cx = 100, cy = 100;
  var undoneCount = undoneItems.length;
  var doneCount = total - undoneCount;
  
  var svg = '<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">';
  svg += '<defs><radialGradient id="cosmoGrad"><stop offset="0%" stop-color="#FFB6D9" stop-opacity="0.3"/><stop offset="100%" stop-color="#C9A6E2" stop-opacity="0.1"/></radialGradient></defs>';
  svg += '<circle cx="100" cy="100" r="90" fill="url(#cosmoGrad)"/>';
  // Stars orbiting
  for (var i = 0; i < total; i++) {
    var angle = (i / total) * Math.PI * 2 - Math.PI / 2;
    var r = 75;
    var x = cx + Math.cos(angle) * r;
    var y = cy + Math.sin(angle) * r;
    var isActive = i < doneCount;
    svg += '<circle cx="' + x + '" cy="' + y + '" r="' + (isActive ? 7 : 5) + '" fill="' + (isActive ? '#FFD700' : '#E8DAF5') + '" ' + (isActive ? 'style="filter:drop-shadow(0 0 6px #FFD700)"' : '') + '>' +
      (isActive ? '<animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="' + (i * 0.15) + 's"/>' : '') +
      '</circle>';
  }
  // Crown center
  svg += '<text x="100" y="108" text-anchor="middle" font-size="36">👑</text>';
  if (allDone) {
    svg += '<text x="100" y="140" text-anchor="middle" font-size="11" fill="#FFD700" font-weight="bold">今日圆满 ✨</text>';
  } else if (undoneCount > 0) {
    svg += '<text x="100" y="140" text-anchor="middle" font-size="11" fill="var(--text-muted)">' + undoneCount + ' 项待完成</text>';
  }
  svg += '</svg>';
  container.innerHTML = svg;
}

  el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">📰 正在获取新闻...</div>';

  // 检查缓存（1小时内的缓存直接用）
  var cacheKey = 'jj_newsCache';
  var cached = LS.get(cacheKey, null);
  if (cached && (Date.now() - cached.time < 3600000)) {
    renderNewsList(el, cached.data);
    return;
  }

  // 尝试多个新闻源（更稳定的源）
  tryFetchNews([
    // 源1: 60s 每日要闻（稳定，Cloudflare Workers，支持CORS）
    { url: 'https://60s.viki.moe/v2/60s?format=json', type: 'json', parse: function(d) {
      if (!d || !d.data || !d.data.news) return null;
      return d.data.news.slice(0, 8).map(function(n, i) {
        return { title: n, source: '要闻' };
      });
    }},
    // 源2: 微博热搜
    { url: 'https://60s.viki.moe/v2/weibo?format=json', type: 'json', parse: function(d) {
      if (!d || !d.data) return null;
      return d.data.slice(0, 8).map(function(i) { return { title: i.title, source: '微博' }; });
    }},
    // 源3: 知乎热榜
    { url: 'https://60s.viki.moe/v2/zhihu?format=json', type: 'json', parse: function(d) {
      if (!d || !d.data) return null;
      return d.data.slice(0, 6).map(function(i) { return { title: i.title, source: '知乎' }; });
    }},
    // 源4: 抖音热搜
    { url: 'https://60s.viki.moe/v2/douyin?format=json', type: 'json', parse: function(d) {
      if (!d || !d.data) return null;
      return d.data.slice(0, 6).map(function(i) { return { title: i.title, source: '抖音' }; });
    }},
  ], 0, el);
}

function tryFetchNews(sources, idx, el) {
  if (idx >= sources.length) {
    // 所有源都失败，用本地兜底
    var cached = LS.get('jj_newsCache', null);
    if (cached) {
      el.innerHTML = '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">📡 离线模式 · 缓存数据</div>';
      renderNewsList(el, cached.data);
    } else {
      el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">📡 当前离线，暂无新闻<br><span style="font-size:11px;">联网后会自动获取今日要闻</span></div>';
    }
    return;
  }

  var src = sources[idx];
  var timeout = setTimeout(function() {
    tryFetchNews(sources, idx + 1, el);
  }, 5000); // 5秒超时

  fetch(src.url, { method: 'GET', timeout: 5000 })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      clearTimeout(timeout);
      var parsed = src.parse(d);
      if (parsed && parsed.length) {
        LS.set('jj_newsCache', { data: parsed, time: Date.now() });
        renderNewsList(el, parsed);
      } else {
        tryFetchNews(sources, idx + 1, el);
      }
    })
    .catch(function(e) {
      clearTimeout(timeout);
      tryFetchNews(sources, idx + 1, el);
    });
}

function renderNewsList(el, news) {
  if (!news || !news.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">暂无新闻数据</div>';
    return;
  }
  var html = '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">更新于 ' + fmtTime(new Date()) + ' · 点击查看原文</div>';
  html += news.slice(0, 8).map(function(n, i) {
    var source = n.source || '热点';
    var sourceColor = source === '微博' ? '#E06060' : source === '抖音' ? '#333' : source === '百度' ? '#3060C0' : source === '知乎' ? '#0084FF' : '#888';
    return '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:13px;">' +
      '<span style="color:var(--text-muted);min-width:18px;">' + (i + 1) + '.</span>' +
      '<span style="flex:1;color:var(--text);line-height:1.5;">' + esc(n.title) + '</span>' +
      '<span style="font-size:10px;color:' + sourceColor + ';align-self:center;flex-shrink:0;">' + source + '</span>' +
    '</div>';
  }).join('');
  el.innerHTML = html;
}

function renderWater(main) {
  var todayWater = STATE.water[today()] || 0;

    cups.push('<div class="water-cup" data-idx="' + i + '" style="width:36px;height:48px;border:2px solid ' + (filled ? 'var(--pink)' : '#E8DAF5') + ';border-radius:0 0 8px 8px;background:' + (filled ? 'var(--pink-light)' : 'transparent') + ';display:flex;align-items:flex-end;justify-content:center;cursor:pointer;font-size:18px;transition:all 0.2s;">' + (filled ? '💧' : '') + '</div>');
  }

  // Week data
  var weekDays = getWeekDays();
  var weekHtml = weekDays.map(function(d) {
    var v = STATE.water[d] || 0;
    return '<div style="text-align:center;"><div style="font-size:10px;color:var(--text-muted);">' + d.slice(5) + '</div><div style="font-size:13px;font-weight:600;color:' + (v >= 7 ? 'var(--pink)' : 'var(--text)') + ';">' + v + '</div><div style="font-size:9px;color:var(--text-muted);">杯</div></div>';
  }).join('');

      '<div class="card-title">💧 喝水打卡</div>' +
      '<div style="font-size:48px;font-weight:800;color:var(--pink);font-family:var(--font-family);margin:12px 0;">' + todayWater + '/7</div>' +
      '<div style="font-size:12px;color:var(--text-muted);">每杯300ml · 目标2100ml</div>' +
      '<div style="display:flex;justify-content:center;gap:8px;margin:16px 0;">' + cups.join('') + '</div>' +
      '<div style="font-size:13px;color:' + (todayWater >= 7 ? '#5cb85c' : 'var(--text-muted)') + ';">' + (todayWater >= 7 ? '🎉 公主喝饱啦！' : '还需 ' + (7 - todayWater) + ' 杯') + '</div>' +
      (STATE.waterLogs && STATE.waterLogs[today()] ? '<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">打卡时间：' + STATE.waterLogs[today()].join(' · ') + '</div>' : '') +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">📊 本周喝水</div>' +
      '<div style="display:flex;justify-content:space-around;margin-top:12px;">' + weekHtml + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">📝 本月达标</div>' +
      '<div style="margin-top:8px;">' +
        '<div style="font-size:24px;font-weight:700;color:var(--purple);">' + getMonthWaterDays() + ' <span style="font-size:12px;color:var(--text-muted);">天达标</span></div>' +
        '<div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" style="width:' + (getMonthWaterDays() / new Date().getDate() * 100) + '%;"></div></div>' +
      '</div>' +
    '</div>';

  main.querySelectorAll('.water-cup').forEach(function(cup) {
    cup.onclick = function() {
      var idx = parseInt(cup.dataset.idx);
      if (idx < todayWater) {
        STATE.water[today()] = idx;
      } else {
        STATE.water[today()] = idx + 1;
      }
      // 记录打卡时间
      if (!STATE.waterLogs) STATE.waterLogs = {};
      if (!STATE.waterLogs[today()]) STATE.waterLogs[today()] = [];
      STATE.waterLogs[today()].push(new Date().toTimeString().slice(0,5));
      saveState('water');
      renderWater(main);
      if (idx + 1 >= 7) toast('🎉 公主喝饱啦！');
    };
  });
}

function getWeekDays() {
  var now = new Date();
  var day = now.getDay();
  var diff = day === 0 ? 6 : day - 1;
  var monday = new Date(now);
  monday.setDate(now.getDate() - diff);
  var days = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

function getMonthWaterDays() {
  var now = new Date();
  var prefix = today().slice(0, 7);
  var count = 0;
  Object.keys(STATE.water).forEach(function(k) {
    if (k.startsWith(prefix) && STATE.water[k] >= 7) count++;
  });
  return count;
}

function switchPlanDay(dir) {
  window._planOffset = (window._planOffset || 0) + dir;
  // 限制范围
  if (window._planOffset < -3) window._planOffset = -3;
  if (window._planOffset > 3) window._planOffset = 3;

  var now = new Date();
  var targetDay = (now.getDay() + window._planOffset + 7) % 7;
  var plan = WORKOUT_PLANS[(targetDay + 6) % 7];

  // 更新计划卡片
  var label = document.getElementById('plan-day-label');
  if (label) label.textContent = plan.day + (window._planOffset === 0 ? ' (今天)' : '');
  var badge = document.getElementById('plan-focus-badge');
  if (badge) badge.textContent = plan.focus;
  var content = document.getElementById('plan-exercises-content');
  if (content) content.textContent = plan.exercises;
}

function saveWorkoutPlan() {
  var now = new Date();
  var plan = WORKOUT_PLANS[(now.getDay() + 6) % 7];
  // 检查今天是否已完成此计划
  var todayDone = STATE.sport.some(function(s) { return s.date === today() && s.note && s.note.indexOf('训练计划') >= 0; });
  STATE.sport.push({
    id: uid(),
    type: plan.focus,
    duration: 30,
    calories: 150,
    date: today(),
    note: '✅ 完成训练计划：' + plan.day + ' ' + plan.focus,
    moves: plan.exercises
  });
  saveState('sport');
  toast('训练计划完成！💪 已自动打卡 +150千卡');
  renderSport(document.getElementById('main'));
}

// 添加自定义运动类别
function addCustomSportType() {
  var name = prompt("请输入新运动类别（如：瑜伽、跳绳、拳击...）", "");
  if (!name || !name.trim()) return;
  var customTypes = LS.get("jj_customSportTypes") || [];
  if (customTypes.indexOf(name.trim()) >= 0) { toast("类别已存在"); return; }
  customTypes.push(name.trim());
  LS.set("jj_customSportTypes", customTypes);
  var sel = document.getElementById("sport-type");
  if (sel) { var opt = document.createElement("option"); opt.value = name.trim(); opt.textContent = name.trim(); opt.selected = true; sel.appendChild(opt); }
  toast("已添加: " + name.trim());
}

function drawBodyChart() {
  var el = document.getElementById('sport-body');
  if (!el) return;
  var data = STATE.bodyData.slice().sort(function(a, b) { return a.date.localeCompare(b.date); });
  if (data.length === 0) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:8px 0;">暂无数据 · 目标 100kg/25%</div>';
    return;
  }
  var latest = data[data.length - 1];
  // 数值卡片
  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">' +
    '<div style="text-align:center;padding:8px;background:var(--pink-light);border-radius:8px;"><div style="font-size:20px;font-weight:700;color:var(--pink-deep);">' + latest.weight + '</div><div style="font-size:10px;color:var(--text-muted);">体重(kg) → 100</div></div>' +
    '<div style="text-align:center;padding:8px;background:var(--purple-light);border-radius:8px;"><div style="font-size:20px;font-weight:700;color:var(--purple-deep);">' + (latest.fat || '-') + '</div><div style="font-size:10px;color:var(--text-muted);">体脂(%) → 25</div></div>' +
  '</div>';

  // SVG 趋势图（体重变化）
  if (data.length >= 2) {
    html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">📈 体重变化趋势</div>';
    html += '<svg viewBox="0 0 300 100" style="width:100%;height:80px;background:var(--bg);border-radius:8px;">';
    var weights = data.map(function(d) { return parseFloat(d.weight) || 0; }).filter(function(w) { return w > 0; });
    if (weights.length >= 2) {
      var minW = Math.min.apply(null, weights) - 2;
      var maxW = Math.max.apply(null, weights) + 2;
      var range = maxW - minW || 1;
      var stepX = 280 / (weights.length - 1);
      var points = weights.map(function(w, i) {
        var x = 10 + i * stepX;
        var y = 90 - ((w - minW) / range) * 70;
        return x + ',' + y;
      }).join(' ');
      html += '<polyline points="' + points + '" fill="none" stroke="var(--pink-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />';
      // 数据点
      weights.forEach(function(w, i) {
        var x = 10 + i * stepX;
        var y = 90 - ((w - minW) / range) * 70;
        html += '<circle cx="' + x + '" cy="' + y + '" r="3" fill="var(--pink)" stroke="var(--pink-deep)" stroke-width="1" />';
      });
    }
    html += '</svg>';
  }
  el.innerHTML = html;
}

function renderSportCalendar() {
  var el = document.getElementById('sport-cal');
  if (!el) return;
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var sportDates = {};
  STATE.sport.forEach(function(s) {
    if (s.date && s.date.startsWith(today().slice(0, 7))) sportDates[s.date] = true;
  });

  var html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">';
  var dayLabels = ['日', '一', '二', '三', '四', '五', '六'];
  dayLabels.forEach(function(l) { html += '<div style="font-size:10px;color:var(--text-muted);padding:2px;">' + l + '</div>'; });
  for (var i = 0; i < firstDay; i++) html += '<div></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = today().slice(0, 8) + String(d).padStart(2, '0');
    var hasSport = sportDates[dateStr];
    html += '<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:50%;background:' + (hasSport ? 'var(--pink)' : 'transparent') + ';color:' + (hasSport ? '#fff' : 'var(--text)') + ';">' + d + '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderRecentSport() {
  var el = document.getElementById('sport-recent');
  if (!el) return;
  var records = STATE.sport.slice().sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); }).slice(0, 10);
  if (records.length === 0) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:8px 0;">暂无运动记录</div>';

      '<span style="font-size:18px;">🏃</span>' +
      '<div style="flex:1;"><div style="font-size:13px;font-weight:600;color:var(--text);">' + esc(r.type) + ' · ' + r.duration + '分钟' + (r.calories ? ' · 🔥' + r.calories + '千卡' : '') + '</div><div style="font-size:11px;color:var(--text-muted);">' + r.date + (r.note ? ' · ' + esc(r.note) : '') + '</div></div>' +

    '</div>';
  }).join('');
}

function deleteSport(id) {
  STATE.sport = STATE.sport.filter(function(r) { return r.id !== id; });

}

  }
}

function nextBreastExercise() {
  _breastExIdx = (_breastExIdx + 1) % BREAST_EXERCISES.length;

}

function startBreastTimer() {
  if (_breastTimer) { toast('提醒已开启'); return; }
  _breastTimer = setInterval(function() {
    if (document.hidden) return; // 不在前台不弹窗
    if (confirm('🌸 久坐提醒！\n\n该起来活动一下啦~\n来一组乳腺疏通操吧！\n\n点击确定查看动作，取消稍后提醒')) {
      switchTab('sport');
    }
  }, 3600000); // 每小时
  toast('⏰ 每小时提醒已开启');
  renderBreastExercise();
}

function stopBreastTimer() {
  if (_breastTimer) { clearInterval(_breastTimer); _breastTimer = null; }
  toast('提醒已停止');
  renderBreastExercise();
}

// 渲染今日待办列表
function renderPlanToday() {
  var el = document.getElementById('plan-today');
  if (!el) return;
  var todayPlans = STATE.plan.filter(function(p) { return p.date === today(); });
  if (todayPlans.length === 0) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:12px 0;">✨ 今天还没有待办，点击上方按钮添加吧</div>';
    return;
  }
  // 未完成在前，紧急>重要>普通
  var order = { 'urgent': 0, 'high': 1, 'normal': 2 };
  todayPlans.sort(function(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (order[a.priority] || 9) - (order[b.priority] || 9);
  });
  var priorityColors = { 'urgent': '#f44336', 'high': '#F0A060', 'normal': '#888' };
  el.innerHTML = todayPlans.map(function(p) {

function renderPlanCalendar() {
  var el = document.getElementById('plan-cal');
  if (!el) return;
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var planMap = {};
  STATE.plan.forEach(function(p) {
    if (!planMap[p.date]) planMap[p.date] = { total: 0, done: 0 };
    planMap[p.date].total++;
    if (p.done) planMap[p.date].done++;
  });

  var html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">';
  var dayLabels = ['日', '一', '二', '三', '四', '五', '六'];
  dayLabels.forEach(function(l) { html += '<div style="font-size:10px;color:var(--text-muted);padding:2px;">' + l + '</div>'; });
  for (var i = 0; i < firstDay; i++) html += '<div></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = today().slice(0, 8) + String(d).padStart(2, '0');
    var info = planMap[dateStr];
    var bg = 'transparent';
    if (info) {
      if (info.done === info.total) bg = '#5cb85c';
      else bg = 'var(--pink)';
    }
    html += '<div style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;border-radius:50%;background:' + bg + ';color:' + (info ? '#fff' : 'var(--text)') + ';">' + d + (info ? '<span style="font-size:8px;">' + info.done + '/' + info.total + '</span>' : '') + '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

// 获取大盘指数（上证、深证、创业板）
function loadMarketIndex() {
  var el = document.getElementById('market-index');
  if (!el) return;
  // 缓存10分钟（交易时段更新频繁）
  var cached = LS.get('jj_marketIndex', null);
  if (cached && (Date.now() - cached.time < 600000)) {
    renderMarketIndex(el, cached.data);
    return;
  }

  el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">📡 正在获取大盘数据...</div>';

  // 用新浪财经JSONP接口（不需要CORS，script标签即可跨域）
  var codes = [
    { sid: 'sh000001', name: '上证指数', key: 'sh' },
    { sid: 'sz399001', name: '深证成指', key: 'sz' },
    { sid: 'sz399006', name: '创业板指', key: 'cy' },
    { sid: 'sh000688', name: '科创50', key: 'kc' },
  ];

  var script = document.createElement('script');
  var cbName = '_mktIdxCb';
  window[cbName] = function() {
    // 全局变量 hq_str_sh000001, hq_str_sz399001 等已被设置
    var results = [];
    codes.forEach(function(c) {
      var raw = window['hq_str_' + c.sid];
      if (raw && typeof raw === 'string') {
        var parts = raw.split(',');
        // 格式: 名称,今开,昨收,当前价,最高,最低,...
        var price = parts[3] || '--';
        var prevClose = parseFloat(parts[2]) || 0;
        var curPrice = parseFloat(price) || 0;
        var change = prevClose ? ((curPrice - prevClose) / prevClose * 100).toFixed(2) : '--';
        results.push({ name: c.name, price: price, change: change });
      } else {
        results.push({ name: c.name, price: '--', change: '--' });
      }
    });
    LS.set('jj_marketIndex', { data: results, time: Date.now() });
    renderMarketIndex(el, results);
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[cbName];
  };

  script.src = 'https://hq.sinajs.cn/list=' + codes.map(function(c) { return c.sid; }).join(',') + '&_=' + Date.now();
  script.onerror = function() {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">📡 大盘数据获取失败<br><span style="font-size:11px;">请检查网络后刷新重试</span></div>';
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[cbName];
  };
  document.body.appendChild(script);
}

function renderMarketIndex(el, data) {
  if (!el) return;
  el.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">' +
    data.map(function(d) {
      var isUp = d.change && d.change.indexOf('-') !== 0;
      var color = isUp ? '#f44336' : '#5cb85c';
      var arrow = isUp ? '↑' : '↓';
      return '<div style="background:var(--bg);padding:8px;border-radius:8px;text-align:center;">' +
        '<div style="font-size:11px;color:var(--text-muted);">' + d.name + '</div>' +
        '<div style="font-size:15px;font-weight:700;color:var(--text);">' + d.price + '</div>' +
        '<div style="font-size:11px;font-weight:600;color:' + color + ';">' + arrow + ' ' + d.change + '%</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

function loadFundData(code) {
  // Use JSONP to fetch fund data from eastmoney
  if (window._fundLoading && window._fundLoading[code]) return;
  if (!window._fundLoading) window._fundLoading = {};
  window._fundLoading[code] = true;

  var callbackName = 'jsonFundCallback_' + code;
  var script = document.createElement('script');

  window[callbackName] = function(data) {
    if (data) {
      var name = data.name || '';
      var nav = data.dwjz || '--';
      var change = data.jzzzl || '--';
      STATE.fundData[code] = { nav: nav, change: change, name: name };

      // Update fund name
      var fund = STATE.funds.find(function(f) { return f.code === code; });
      if (fund) fund.name = name;
      saveState('funds');
      saveState('fundData');
      renderWatchFunds();
    }
    if (script.parentNode) script.parentNode.removeChild(script);
    delete window[callbackName];
    delete window._fundLoading[code];
  };

  script.src = 'https://fundgz.1234567.com.cn/js/' + code + '.js?rt=' + Date.now();
  script.onerror = function() {
    // Fallback: try another API
    script.parentNode && script.parentNode.removeChild(script);
    delete window[callbackName];
    delete window._fundLoading[code];
  };
  document.body.appendChild(script);
}

      '<div style="display:flex;gap:2px;margin-top:8px;flex-wrap:wrap;">' + renderCheckinDots(checkins, h.created) + '</div>' +
    '</div>';
  }).join('');
}

function calcStreak(checkins) {
  if (!checkins || checkins.length === 0) return 0;
  var sorted = checkins.slice().sort().reverse();
  var d = today();
  if (sorted[0] !== d && sorted[0] !== yesterday()) return 0;
  var streak = 0;
  var cur = d;
  for (var i = 0; i < sorted.length; i++) {
    if (sorted[i] === cur) { streak++; cur = prevDay(cur); }
    else if (sorted[i] === prevDay(cur)) { streak++; cur = sorted[i]; }
    else break;
  }
  return streak;
}

function yesterday() {
  var d = new Date(); d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}

function prevDay(ds) {
  var d = new Date(ds); d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}

function renderCheckinDots(checkins, created) {
  var html = '';
  var d = new Date(created || today());
  var end = new Date();
  var count = 0;
  while (d <= end && count < 90) {
    var ds = d.toISOString().split('T')[0];
    var checked = checkins.indexOf(ds) >= 0;
    html += '<span style="width:8px;height:8px;border-radius:2px;display:inline-block;' + (checked ? 'background:#5CB85C;' : 'background:#eee;') + '"></span>';
    d.setDate(d.getDate() + 1);
    count++;
  }
  return html;
}

function toggleHabitCheck(id) {
  var h = STATE.habits.find(function(x) { return x.id === id; });
  if (!h) return;
  var d = today();
  if (!h.checkins) h.checkins = [];
  var idx = h.checkins.indexOf(d);
  if (idx >= 0) { h.checkins.splice(idx, 1); }
  else { h.checkins.push(d); }
  saveState('habits');
  renderHabit(document.getElementById('main'));
}

function deleteHabit(id) {
  STATE.habits = STATE.habits.filter(function(h) { return h.id !== id; });
  saveState('habits');
  renderHabit(document.getElementById('main'));
}

  function tick() {
    if (!t.running) return;
    t.seconds--;
    if (t.seconds <= 0) {
      t.running = false;
      clearInterval(t.interval);
      if (t.mode === 'study') {
        var minutes = Math.round(t.totalSeconds / 60);
        STATE.bankStudy.timerLog.push({ date: today(), duration: minutes });
        STATE.bankStudy.logs.push({ id: uid(), date: today(), duration: minutes, content: '番茄钟学习 - ' + BANK_SUBJECTS[t.subject] });
        saveBankStudy();
        toast('学习完成！休息一下吧~ 🎉');
        t.mode = 'rest'; t.seconds = 5 * 60; t.totalSeconds = 5 * 60;
      } else {
        toast('休息结束，继续加油！💪');
        t.mode = 'study'; t.seconds = 25 * 60; t.totalSeconds = 25 * 60;
      }
      var btn = document.getElementById('bk-timer-toggle');
      if (btn) { btn.textContent = '开始'; btn.className = 'btn btn-primary'; }
    }
    updateDisplay();
  }

  modal.innerHTML =
    '<div class="modal-content" style="text-align:center;width:320px;" onclick="event.stopPropagation()">' +
      '<div class="card-title">⏱️ 番茄钟</div>' +
      '<div style="position:relative;width:200px;height:200px;margin:10px auto;">' +
        '<svg width="200" height="200" style="transform:rotate(-90deg);">' +
          '<circle cx="100" cy="100" r="80" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="8"/>' +
          '<circle id="bk-timer-ring" cx="100" cy="100" r="80" fill="none" stroke="var(--purple)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (2 * Math.PI * 80) + '" stroke-dashoffset="' + (2 * Math.PI * 80) + '" style="transition:stroke-dashoffset 1s linear;"/>' +
        '</svg>' +
        '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"><div id="bk-timer-display" style="font-size:40px;font-weight:800;">25:00</div><div style="font-size:12px;color:var(--purple);">📖 学习时间</div></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:16px;">' +
        '<button id="bk-timer-toggle" class="btn btn-primary" style="flex:1;" onclick="(function(b){var t=STATE._bankTimer;if(t.running){clearInterval(t.interval);t.running=false;b.textContent=\'开始\';b.className=\'btn btn-primary\';}else{t.running=true;b.textContent=\'暂停\';b.className=\'btn btn-purple\';t.interval=setInterval(function(){t.seconds--;if(t.seconds<=0){t.running=false;clearInterval(t.interval);toast(\'完成！\');b.textContent=\'开始\';b.className=\'btn btn-primary\';}var m=Math.floor(t.seconds/60),s=t.seconds%60;var d=document.getElementById(\'bk-timer-display\');if(d)d.textContent=String(m).padStart(2,\'0\')+":"+String(s).padStart(2,\'0\');var r=document.getElementById(\'bk-timer-ring\');if(r)r.style.strokeDashoffset=2*Math.PI*80*(1-(t.totalSeconds-t.seconds)/t.totalSeconds);},1000);}})(this)">' + (t.running ? '暂停' : '开始') + '</button>' +
        '<button class="btn btn-outline" style="flex:1;" onclick="(function(){var t=STATE._bankTimer;clearInterval(t.interval);t.running=false;t.seconds=25*60;t.totalSeconds=25*60;var d=document.getElementById(\'bk-timer-display\');if(d)d.textContent=\'25:00\';var b=document.getElementById(\'bk-timer-toggle\');if(b){b.textContent=\'开始\';b.className=\'btn btn-primary\';}toast(\'已重置\');})()">重置</button>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:10px;">25分钟学习 + 5分钟休息</div>' +
    '</div>';
  document.body.appendChild(modal);
  modal.onclick = function(e) { if (e.target === modal) { if (t.interval) clearInterval(t.interval); t.running = false; modal.remove(); } };
  updateDisplay();
  if (t.running && t.interval) { clearInterval(t.interval); t.interval = setInterval(tick, 1000); }
}

// 拍照/图片处理：转base64并尝试OCR识别
function handleWrongImg(input) {
  var file = input.files[0];
  if (!file) return;
  var el = document.getElementById('wrong-ocr-result');
  if (el) el.innerHTML = '🔍 正在识别图片文字...';

  // 压缩图片并转base64
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 800;
      var scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var base64 = canvas.toDataURL('image/jpeg', 0.7);
      window._wrongImgData = base64;

      // 简单OCR：用canvas读取像素信息提示用户
      if (el) {
        el.innerHTML = '✅ 图片已扫描！请手动输入题目文字（浏览器本地OCR功能有限，建议手动录入或使用微信扫一扫识别后粘贴）<br><span style="font-size:10px;">图片已保存，可在错题中查看</span>';
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function _koreanDuolingoCheckin(wrap) {

  grid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:4px;';

  var now = new Date();

    var d = new Date(now); d.setDate(d.getDate() - i);
    var ds = d.toISOString().split('T')[0];

    var dayName = ['日','一','二','三','四','五','六'][d.getDay()];
    var cell = document.createElement('div');
    cell.style.cssText = 'text-align:center;padding:6px 2px;background:' + (checked ? '#58CC02' : 'var(--pink-light)') + ';border-radius:8px;cursor:pointer;color:' + (checked ? '#fff' : 'var(--text)') + ';font-size:11px;';

  // 连胜统计
  var streak = 0;
  for (var j = 0; j < 365; j++) {
    var cd = new Date(); cd.setDate(cd.getDate() - j);
    if (STATE.korean.duolingo[cd.toISOString().split('T')[0]]) streak++; else break;
  }
  var streakDiv = document.createElement('div');
  streakDiv.style.cssText = 'margin-top:8px;font-size:12px;text-align:center;';
  streakDiv.innerHTML = streak > 0 ? '🔥 连胜 <b style="color:#58CC02;">' + streak + '</b> 天！继续加油！' : '今天还没有打卡哦~';
  card.appendChild(streakDiv);

  wrap.appendChild(card);
}

var _koreanQuizState = { questions: [], index: 0, correct: 0, total: 0 };

function _koreanStartQuiz() {
  var cards = STATE.korean.cards;
  if (cards.length < 4) { toast('至少需要4张卡片'); return; }
  var pool = cards.slice().sort(function() { return Math.random() - 0.5; });
  var count = Math.min(10, pool.length);
  var questions = [];
  for (var i = 0; i < count; i++) {
    var correctCard = pool[i];
    var options = [correctCard.back];
    while (options.length < 4) {
      var rand = pool[Math.floor(Math.random() * pool.length)];
      if (options.indexOf(rand.back) === -1) options.push(rand.back);
    }
    options = options.sort(function() { return Math.random() - 0.5; });
    questions.push({ front: correctCard.front, correct: correctCard.back, options: options });
  }
  _koreanQuizState = { questions: questions, index: 0, correct: 0, total: count };
  _koreanRenderQuiz();
}

function _koreanRenderQuiz() {
  var area = document.getElementById('korean-quiz-area');
  if (!area) return;
  area.innerHTML = '';
  var s = _koreanQuizState;
  if (s.questions.length === 0) { area.style.display = 'none'; return; }
  area.style.display = 'block';
  if (s.index >= s.total) {
    var rate = Math.round(s.correct / s.total * 100);
    STATE.korean.quizScore[today()] = { total: s.total, correct: s.correct };
    saveState('korean');
    area.innerHTML = '<div class="card" style="text-align:center;"><div style="font-size:40px;">' + (rate >= 80 ? '🎉' : rate >= 60 ? '💪' : '📚') + '</div><div class="card-title">答题完成！</div><div style="margin-top:8px;">答对 <b style="color:var(--purple);">' + s.correct + '</b>/' + s.total + '，正确率 <b style="color:var(--pink);">' + rate + '%</b></div><button class="btn btn-primary" style="margin-top:12px;" onclick="_koreanStartQuiz()">再答一轮</button></div>';
    _koreanQuizState = { questions: [], index: 0, correct: 0, total: 0 };
    return;
  }
  var q = s.questions[s.index];
  var card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:var(--gap);"><span class="card-title" style="margin:0;">📝 答题</span><span style="font-size:12px;color:var(--text-muted);">' + (s.index + 1) + '/' + s.total + ' · 已对' + s.correct + '</span></div><div style="text-align:center;font-size:24px;font-weight:bold;color:var(--purple-deep);background:var(--pink-light);border-radius:var(--radius);padding:20px;margin-bottom:var(--gap);">' + esc(q.front) + '</div>';
  var ow = document.createElement('div');
  ow.style.cssText = 'display:flex;flex-direction:column;gap:var(--gap-sm);';
  q.options.forEach(function(opt) {
    var b = document.createElement('button');
    b.className = 'btn btn-outline'; b.style.textAlign = 'left'; b.textContent = opt;
    b.onclick = function() {
      ow.querySelectorAll('button').forEach(function(x) { x.disabled = true; });
      if (opt === q.correct) { b.className = 'btn btn-primary'; b.textContent = '✓ ' + opt; s.correct++; toast('答对了！🎉'); }
      else { b.style.cssText += 'background:#f8d7da;color:#721c24;'; b.textContent = '✗ ' + opt; toast('正确：' + q.correct); }
      setTimeout(function() { s.index++; _koreanRenderQuiz(); }, 1200);
    };
    ow.appendChild(b);
  });
  card.appendChild(ow);
  area.appendChild(card);
}

  var modal = _createModalBox(day + ' 计划');
  var taskInput = document.createElement('input');
  taskInput.placeholder = '今日学习目标'; taskInput.style.cssText = _inputStyle();
  taskInput.value = (plan[day] && plan[day].task) ? plan[day].task : '';
  var doneLabel = document.createElement('label');
  doneLabel.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;';
  var doneCheck = document.createElement('input');
  doneCheck.type = 'checkbox'; doneCheck.checked = plan[day] && plan[day].done ? true : false;
  doneLabel.appendChild(doneCheck); doneLabel.appendChild(document.createTextNode('已完成'));
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;margin-top:var(--gap);';
  var saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary'; saveBtn.textContent = '保存';
  saveBtn.onclick = function() {
    plan[day] = { task: taskInput.value.trim(), done: doneCheck.checked };
    LS.set(planKey, plan); toast('已保存'); overlay.remove(); onDone();
  };
  var clearBtn = document.createElement('button');
  clearBtn.className = 'btn btn-outline'; clearBtn.textContent = '清除';
  clearBtn.onclick = function() { delete plan[day]; LS.set(planKey, plan); toast('已清除'); overlay.remove(); onDone(); };
  btnRow.appendChild(saveBtn); btnRow.appendChild(clearBtn);
  modal.appendChild(taskInput); modal.appendChild(doneLabel); modal.appendChild(btnRow);
  overlay.appendChild(modal); document.body.appendChild(overlay);
  taskInput.focus();
}

function changePassword() {
  var p1 = document.getElementById('set-new-pwd').value;
  var p2 = document.getElementById('set-new-pwd2').value;
  if (!p1 || p1.length !== 4) { toast('密码需4位数字'); return; }
  if (p1 !== p2) { toast('两次密码不一致'); return; }
  if (!/^\d{4}$/.test(p1)) { toast('密码需4位数字'); return; }
  LS.set('jj_password', hashCode(p1));
  toast('密码已修改');
  document.getElementById('set-new-pwd').value = '';
  document.getElementById('set-new-pwd2').value = '';
}

function exportBackup() {
  var data = {};
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.startsWith('jj_')) {
      try { data[key] = JSON.parse(localStorage.getItem(key)); } catch(e) { data[key] = localStorage.getItem(key); }
    }
  }
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.download = 'jingjing_backup_' + today() + '.json';
  link.href = url;
  link.click();
  URL.revokeObjectURL(url);
  toast('备份已导出 📤');
}

function importBackup() {
  var fileInput = document.getElementById('import-file');
  if (!fileInput.files[0]) { toast('请选择备份文件'); return; }
  var file = fileInput.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!confirm('导入将覆盖当前数据，确认继续？')) return;
      Object.keys(data).forEach(function(key) {
        if (key.startsWith('jj_')) {
          localStorage.setItem(key, JSON.stringify(data[key]));
        }
      });
      toast('恢复成功！正在刷新...');
      setTimeout(function() { location.reload(); }, 1500);
    } catch(err) {
      toast('文件格式错误');
    }
  };
  reader.readAsText(file);
}

function saveNavConfig() {
  var cfg = { visible: [], more: [] };
  var visibleCount = 0;
  document.querySelectorAll('.nav-toggle').forEach(function(sel) {
    var key = sel.dataset.key;
    var val = sel.value;
    if (val === 'visible' && visibleCount < 5) { cfg.visible.push(key); visibleCount++; }
    else if (val === 'more' || (val === 'visible' && visibleCount >= 5)) { cfg.more.push(key); }
  });
  // Ensure home is always visible
  if (cfg.visible.indexOf('home') < 0) cfg.visible.unshift('home');
  STATE.navConfig = cfg;
  LS.set('jj_navConfig', cfg);
  toast('模块设置已保存');
  renderNav();
}

// 获取所有数据的JSON字符串
function getAllDataJSON() {
  var data = {};
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.startsWith('jj_')) {
      try { data[key] = JSON.parse(localStorage.getItem(key)); } catch(e) { data[key] = localStorage.getItem(key); }
    }
  }
  data._exportTime = new Date().toISOString();
  data._version = '1.2';
  return JSON.stringify(data, null, 2);
}

// 从JSON字符串恢复数据
function restoreFromJSON(jsonStr) {
  try {
    var data = JSON.parse(jsonStr);
    Object.keys(data).forEach(function(key) {
      if (key.startsWith('jj_')) {
        localStorage.setItem(key, JSON.stringify(data[key]));
      }
    });
    return true;
  } catch(e) {
    return false;
  }
}

// 生成同步码（用于跨设备同步的简短码）
function generateSyncCode() {
  var data = getAllDataJSON();
  // 用 base64 编码压缩
  var encoded = btoa(unescape(encodeURIComponent(data)));
  // 如果数据太大，提示用文件方式
  if (encoded.length > 50000) {
    return null; // 太大，建议用文件
  }
  return encoded;
}

// 从同步码恢复
function restoreFromSyncCode(code) {
  try {
    var decoded = decodeURIComponent(escape(atob(code)));
    return restoreFromJSON(decoded);
  } catch(e) {
    return false;
  }
}

// 复制到剪贴板
function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { toast('已复制到剪贴板 📋'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板 📋'); } catch(e) { toast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }
}

// 分享到微信：复制数据到剪贴板
function shareToWechat() {
  var data = getAllDataJSON();
  // 尝试用 Clipboard API
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(data).then(function() {
      toast('✅ 数据已复制到剪贴板！\n📱 打开微信→文件传输助手→粘贴发送\n💡 需要恢复时复制回来粘贴到同步码框');
    }).catch(function() {
      fallbackCopyWechat(data);
    });
  } else {
    fallbackCopyWechat(data);
  }
}

function fallbackCopyWechat(data) {
  var ta = document.createElement('textarea');
  ta.value = data;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('✅ 数据已复制！📱 打开微信→文件传输助手→粘贴发送');
  } catch(e) {
    toast('❌ 复制失败，请用导出备份方式');
  }
  document.body.removeChild(ta);
}

// 监听数据变化，自动保存并记录时间
function setupAutoSave() {
  // 拦截 LS.set，记录保存时间
  var originalSet = LS.set;
  LS.set = function(key, value) {
    originalSet(key, value);
    if (key !== '_lastSaveTime') {
      var now = new Date();
      var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
      localStorage.setItem('jj__lastSaveTime', JSON.stringify(timeStr));
    }
  };

  // 页面卸载时强制保存所有数据
  window.addEventListener('beforeunload', function() {
    saveAllState();
  });

  // 页面隐藏时也保存（移动端切换app）
  window.addEventListener('pagehide', function() {
    saveAllState();
  });

  // 定期自动保存（每30秒）
  setInterval(function() {
    saveAllState();
  }, 30000);
}

function initPWA() {
  // Manifest via Blob
  var manifest = {
    name: '晶晶公主工作台',
    short_name: '晶晶工作台',
    description: '公主的专属工作台',
    start_url: '.',
    display: 'standalone',
    background_color: '#FFF5FA',
    theme_color: '#FFB6D9',
    icons: []
  };
  var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  var manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(manifestBlob);
  document.head.appendChild(manifestLink);

  // Service Worker via Blob
  var swCode = [
    'var CACHE_NAME = "jingjing-v1";',
    'var CACHE_URLS = [".", "./index.html"];',
    'self.addEventListener("install", function(e) {',
    '  e.waitUntil(caches.open(CACHE_NAME).then(function(c) { return c.addAll(CACHE_URLS).catch(function(){}); }));',
    '  self.skipWaiting();',
    '});',
    'self.addEventListener("activate", function(e) {',
    '  e.waitUntil(caches.keys().then(function(keys) {',
    '    return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));',
    '  }));',
    '  self.clients.claim();',
    '});',
    'self.addEventListener("fetch", function(e) {',
    '  e.respondWith(',
    '    caches.match(e.request).then(function(res) {',
    '      if (res) return res;',
    '      return fetch(e.request).then(function(res) {',
    '        if (!res || res.status !== 200 || res.type !== "basic") return res;',
    '        var clone = res.clone();',
    '        caches.open(CACHE_NAME).then(function(c) { c.put(e.request, clone); });',
    '        return res;',
    '      }).catch(function() { return caches.match("./index.html"); });',
    '    })',
    '  );',
    '});'
  ].join('\n');

  try {
    var swBlob = new Blob([swCode], { type: 'application/javascript' });
    var swUrl = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(swUrl).then(function(reg) {
        console.log('SW registered');
      }).catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    }
  } catch(e) {
    console.warn('PWA init failed:', e);
  }
}

function tryFetchWikiContent(cat, resultEl, attempt) {
  var apis = [
    // 用每日60s的tip字段获取每日小知识
    { url: 'https://60s.viki.moe/v2/60s?format=json', parse: function(d) {
      if (!d || !d.data) return null;
      return { title: '📅 ' + d.data.date + ' · 每日金句', content: d.data.tip || '暂无今日金句', source: '每日60s' };
    }},
    // 备用：随机知识
    null
  ];

  if (attempt >= apis.length) {
    // 所有API都失败，显示预设知识
    var presets = getPresetKnowledge(cat.key);
    if (presets && presets.length) {
      var pick = presets[Math.floor(Math.random() * presets.length)];
      resultEl.innerHTML = renderWikiCard(pick.title, pick.content, '本地知识库');
    } else {
      resultEl.innerHTML = '<div style="text-align:center;padding:20px 0;color:var(--text-muted);">📡 网络连接失败，请稍后重试<br><span style="font-size:11px;">已缓存离线知识可供浏览</span></div>';
    }
    return;
  }

  var api = apis[attempt];
  if (!api) { tryFetchWikiContent(cat, resultEl, attempt + 1); return; }

  var timeout = setTimeout(function() { tryFetchWikiContent(cat, resultEl, attempt + 1); }, 5000);
  fetch(api.url)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      clearTimeout(timeout);
      var parsed = api.parse(d);
      if (parsed) {
        resultEl.innerHTML = renderWikiCard(parsed.title, parsed.content, parsed.source);
      } else {
        tryFetchWikiContent(cat, resultEl, attempt + 1);
      }
    })
    .catch(function() {
      clearTimeout(timeout);
      tryFetchWikiContent(cat, resultEl, attempt + 1);
    });
}

// 每日推荐（随机从不同分类中各取一条）
function loadWikiDaily() {
  var el = document.getElementById('wiki-daily');
  if (!el) return;

  // 随机选3个分类
  var shuffled = WIKI_CATEGORIES.slice().sort(function() { return Math.random() - 0.5; }).slice(0, 3);
  var items = [];
  shuffled.forEach(function(cat) {
    var presets = getPresetKnowledge(cat.key);
    if (presets && presets.length) {
      var pick = presets[Math.floor(Math.random() * presets.length)];
      items.push('<div style="margin-bottom:10px;padding:10px;background:var(--bg);border-radius:10px;border-left:3px solid var(--purple);">' +
        '<div style="font-weight:700;color:var(--purple-deep);margin-bottom:4px;">' + cat.icon + ' ' + pick.title + '</div>' +
        '<div style="color:var(--text);">' + pick.content + '</div>' +
        '<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">#' + cat.name + '</div>' +
      '</div>');
    }
  });

  el.innerHTML = items.join('') || '<div style="text-align:center;color:var(--text-muted);">暂无推荐</div>';
}
